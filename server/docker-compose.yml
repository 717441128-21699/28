version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cheyipai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cheyipai123
      MYSQL_DATABASE: cheyipai
      MYSQL_USER: cheyipai
      MYSQL_PASSWORD: cheyipai123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:latest
    container_name: cheyipai-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
